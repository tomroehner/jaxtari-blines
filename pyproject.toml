[project]
name = "jaxtari-blines"
version = "0.1.0"
description = "Simple jax-based baseline implementations for efficient evaluation on JAXtari."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jaxtari",
    "rtpt>=0.0.4",
    "wandb[media]>=0.27.0",
    "hydra-core>=1.3.2",
    "jax[cuda12]", # use "jax" if no cuda available
    "flashbax",
    "kfac-jax",
]

[project.optional-dependencies]
# agents/scobots/viper.py (decision-tree distillation): uv sync --extra viper
viper = ["scikit-learn"]

[tool.uv.sources]
# local checkout (../JAXtari, kept on dev); editable so runs always use its current HEAD
jaxtari = { path = "../JAXtari", editable = true }
kfac-jax = { git = "https://github.com/google-deepmind/kfac-jax.git" }

[tool.uv]
override-dependencies = [
    # uncomment if you are on macos with intel cpu
    #"jax==0.4.38; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    #"jaxlib==0.4.38; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # wandb[media] dependencies for intel macos
    #"rdkit==2025.9.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    #"flax==0.10.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

